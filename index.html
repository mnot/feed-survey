<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Feed Survey Reports</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      padding: 3rem 1.25rem;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 1.5rem;
      color: color-mix(in srgb, CanvasText 72%, Canvas 28%);
    }

    ol {
      padding-left: 1.25rem;
    }

    li {
      margin: 0.75rem 0;
    }

    a {
      color: LinkText;
    }

    .run {
      display: block;
      color: color-mix(in srgb, CanvasText 64%, Canvas 36%);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Feed Survey Reports</h1>
    <p>Published reports from Web Feed Survey crawl analyses.</p>
    <ol>
      <li>
        <a href="2026-05-10/">2026-05-10 report</a>
        <span class="run">CC-MAIN-2026-12-20260510-202407</span>
      </li>
    </ol>
  </main>
</body>
</html>
