runners:
  emr:
    region: us-east-1
    iam_instance_profile: EMR_EC2_DefaultRole
    iam_service_role: EMR_DefaultRole
    image_version: 7.12.0
    python_bin: /usr/bin/python3.12 -u
    
    bootstrap:
      - sudo yum install -y gcc gcc-c++ python3.12 python3.12-devel python3.12-pip libxml2-devel libxslt-devel zlib-devel lz4-devel brotli-devel 2>&1
      - sudo /usr/bin/python3.12 -m pip install --upgrade pip 2>&1
      - sudo /usr/bin/python3.12 -m pip install --prefer-binary mrjob fastwarc feedparser beautifulsoup4 lxml python-dateutil requests 2>&1
      - sudo -u hadoop /usr/bin/python3.12 -c "import mrjob; import fastwarc; import requests; print('BOOTSTRAP_VERIFIED')" >> /tmp/diag.txt 2>&1
    jobconf:
      mapreduce.map.memory.mb: 4096
      mapreduce.map.java.opts: -Xmx3072m
      mapreduce.reduce.memory.mb: 4096
      mapreduce.reduce.java.opts: -Xmx3072m
      fs.s3a.requester-pays.enabled: "true"

    upload_files:
      - cc_feeds/processor.py#processor.py
      - cc_feeds/utils.py#utils.py
      - /Users/mnot/.cache/cc-feeds/top-1m.csv#top-1m.csv

    instance_fleets:
      - InstanceFleetType: MASTER
        TargetOnDemandCapacity: 1
        InstanceTypeConfigs:
          - InstanceType: m5.xlarge
      - InstanceFleetType: CORE
        TargetSpotCapacity: 100
        InstanceTypeConfigs:
          - InstanceType: m5.xlarge
          - InstanceType: m5d.xlarge
          - InstanceType: r5.xlarge
          - InstanceType: r5d.xlarge
          - InstanceType: c5.xlarge
