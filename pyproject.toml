[project]
name = "feed-survey"
dynamic = ["version"]
authors = [
    {name="Mark Nottingham", email="mnot@mnot.net"}
]
description = "Surveying Web feed usage in Common Crawl"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "beautifulsoup4",
    "jinja2",
    "requests",
    "python-dateutil",
    "lxml",
    "publicsuffix2"
]

[project.optional-dependencies]
emr = [
    "boto3",
    "fastwarc",
    "tqdm",
    "mrjob"
]
dev = [
    "feed-survey[emr]",
    "mypy",
    "black",
    "isort",
    "pylint",
    "pytest",
    "pytest-md",
    "validate-pyproject",
    "build",
    "types-requests",
    "types-python-dateutil",
    "types-tqdm",
    "boto3-stubs[s3]",
    "lxml-stubs"
]

[project.urls]
homepage = "https://github.com/mnot/feed-survey"

[project.scripts]
feed-survey-opml = "feed_survey.opml:main"
feed-survey-probe = "feed_survey.probe:main"


[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "feed_survey.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["feed_survey", "feed_survey.*"]
exclude = ["build*", "dist*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"feed_survey" = ["py.typed"]
"feed_survey.report" = ["template.html"]

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "mrjob.*",
    "fastwarc.*",
    "botocore.*",
    "boto3.*",
    "jinja2.*",
    "publicsuffix2.*"
]
ignore_missing_imports = true

