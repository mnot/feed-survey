[project]
name = "feed-survey"
dynamic = ["version"]
authors = [
    {name="Mark Nottingham", email="mnot@mnot.net"}
]
description = "Surveying Web feed usage in Common Crawl"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "boto3",
    "fastwarc",
    "beautifulsoup4",
    "jinja2",
    "requests",
    "tqdm",
    "mrjob",
    "python-dateutil",
    "lxml",
    "publicsuffix2"
]

[project.optional-dependencies]
dev = [
    "mypy",
    "black",
    "isort",
    "pylint",
    "pytest",
    "pytest-md",
    "validate-pyproject",
    "build",
    "types-requests",
    "types-python-dateutil",
    "types-tqdm",
    "boto3-stubs[s3]",
    "lxml-stubs"
]

[project.urls]
homepage = "https://github.com/mnot/feed-survey"

[project.scripts]
feed-survey = "feed_survey.main:main"
feed-survey-job = "feed_survey.emr.job:main"
feed-survey-finalize = "feed_survey.emr.finalize:main"
feed-survey-mock-report = "feed_survey.report.mock:main"
feed-survey-probe = "feed_survey.probe:main"
feed-survey-split-paths = "feed_survey.emr.split_paths:main"


[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "feed_survey.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["feed_survey", "feed_survey.*"]
exclude = ["build*", "dist*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"feed_survey" = ["py.typed"]
"feed_survey.report" = ["template.html"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "mrjob.*",
    "fastwarc.*",
    "botocore.*",
    "boto3.*",
    "jinja2.*",
    "publicsuffix2.*"
]
ignore_missing_imports = true

[tool.pylint.basic]
function-rgx = "[a-z_][a-z0-9_]{1,30}$"
variable-rgx = "[a-z_][a-z0-9_]{1,30}$"
attr-rgx = "[a-z_][a-z0-9_]{1,30}$"
argument-rgx = "[a-z_][a-z0-9_]{1,30}$"
class-attribute-rgx = "([A-Za-z_][A-Za-z0-9_]{1,30}|(__.*__))$"
method-rgx = "[a-z_][a-z0-9_]{1,30}$"
class-rgx = "[a-zA-Z0-9_]+$"

[tool.pylint.messages_control]
disable = "C0114,C0115,C0116,W0613"

[tool.pylint.reports]
reports = false
persistent = false

[tool.pylint.variables]
dummy-variables-rgx = "_"

[tool.pylint.design]
max-args=10
max-locals=35
max-branches=25
max-statements=100
max-attributes=40
min-public-methods=1

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.isort]
profile = "black"
