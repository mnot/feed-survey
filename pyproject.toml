[project]
name = "cc-feeds"
dynamic = ["version"]
authors = [
    {name="Mark Nottingham", email="mnot@mnot.net"}
]
description = "Finding out about Web feeds on Common Crawl"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "boto3",
    "fastwarc",
    "feedparser",
    "beautifulsoup4",
    "jinja2",
    "requests",
    "tqdm",
    "mrjob",
    "python-dateutil",
    "lxml"
]

[project.optional-dependencies]
dev = [
    "mypy",
    "black",
    "isort",
    "pylint",
    "pytest",
    "pytest-md",
    "validate-pyproject",
    "build",
    "types-requests",
    "types-python-dateutil",
    "types-tqdm",
    "boto3-stubs[s3]",
    "lxml-stubs"
]

[project.urls]
homepage = "https://github.com/mnot/cc-feeds"

[project.scripts]
cc-feeds = "cc_feeds.main:main"
cc-feeds-job = "mr_job:main"


[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "cc_feeds.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cc_feeds", "cc_feeds.*"]
exclude = ["build*", "dist*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cc_feeds = ["py.typed"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "mrjob.*",
    "fastwarc.*",
    "botocore.*",
    "boto3.*",
    "jinja2.*"
]
ignore_missing_imports = true

[tool.pylint.basic]
function-rgx = "[a-z_][a-z0-9_]{1,30}$"
variable-rgx = "[a-z_][a-z0-9_]{1,30}$"
attr-rgx = "[a-z_][a-z0-9_]{1,30}$"
argument-rgx = "[a-z_][a-z0-9_]{1,30}$"
class-attribute-rgx = "([A-Za-z_][A-Za-z0-9_]{1,30}|(__.*__))$"
method-rgx = "[a-z_][a-z0-9_]{1,30}$"
class-rgx = "[a-zA-Z0-9_]+$"

[tool.pylint.messages_control]
disable = "C0114,C0115,C0116,W0613"

[tool.pylint.reports]
reports = false

[tool.pylint.variables]
dummy-variables-rgx = "_"

[tool.pylint.design]
max-args=10
max-locals=35
max-branches=25
max-statements=100
max-attributes=40
min-public-methods=1

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.isort]
profile = "black"
